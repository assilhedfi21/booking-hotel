# Full stack: Kafka broker + 3 microservices + API Gateway.
# Run from the project root: docker compose up --build
# Then open http://localhost:4000

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: hotel-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hotel-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hotel-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  hotel-service:
    build:
      context: .
      target: hotel-service
    container_name: hotel-service
    environment:
      HOTEL_GRPC_PORT: "50051"
      KAFKA_BROKER: "kafka:9092"
    ports:
      - "50051:50051"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - hotel_data:/app/data

  booking-service:
    build:
      context: .
      target: booking-service
    container_name: booking-service
    environment:
      BOOKING_GRPC_PORT: "50052"
      KAFKA_BROKER: "kafka:9092"
    ports:
      - "50052:50052"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - booking_data:/app/data

  notification-service:
    build:
      context: .
      target: notification-service
    container_name: notification-service
    environment:
      NOTIFICATION_GRPC_PORT: "50053"
      KAFKA_BROKER: "kafka:9092"
      HOTEL_GRPC_TARGET: "hotel-service:50051"
    ports:
      - "50053:50053"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - notification_data:/app/data

  api-gateway:
    build:
      context: .
      target: api-gateway
    container_name: api-gateway
    environment:
      GATEWAY_PORT: "4000"
      HOTEL_GRPC_TARGET: "hotel-service:50051"
      BOOKING_GRPC_TARGET: "booking-service:50052"
      NOTIFICATION_GRPC_TARGET: "notification-service:50053"
    ports:
      - "4000:4000"
    depends_on:
      - hotel-service
      - booking-service
      - notification-service

volumes:
  kafka_data:
  hotel_data:
  booking_data:
  notification_data:
